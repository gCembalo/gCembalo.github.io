<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Pagina non trovata</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      color: #24292e;
      background-color: #ffffff;
      line-height: 1.6;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 0.5em;
    }
    p {
      font-size: 1.2em;
      margin: 1em 0;
    }
    a {
      color: #0366d6;
      text-decoration: none;
      border-bottom: 1px dotted #0366d6;
    }
    a:hover {
      text-decoration: underline;
    }
    .emoji {
      font-size: 3em;
    }

      text-align: center;
      margin-top: 100px;
    }

<body>
  <div class="container">
    <div class="emoji">🤷‍♂️</div>
    <h1>Oops! Questa pagina non esiste.</h1>
    <p>Hai trovato un angolo segreto del sito... o più probabilmente un link rotto.</p>
    <p><a href="/">Torna alla home</a> prima che qualcuno se ne accorga.</p>
  </div>

</html>
